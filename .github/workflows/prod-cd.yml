name: Prod CD

on:
  push:
    branches:
      - "main"
    paths:
      - "weather-microservice/**"
      - "alert-microservice/**"
      - "transport-microservice/**"
      - "testing-microservice/**"
      -  ".github/workflows/**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-weather-prod:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up SAM
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: SAM Build
        run: sam build
        working-directory: weather-microservice

      - name: SAM Deploy Prod
        run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --config-env prod
        working-directory: weather-microservice

      - name: Install testing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r testing-microservice/requirements.txt

      - name: Create reports directory
        run: mkdir -p testing-microservice/reports

      - name: Run weather smoke tests
        run: |
          cd testing-microservice && pytest tests/weather/smoke \
            --env prod \
            --junitxml=reports/weather-prod-results.xml

      - name: Generate weather prod report
        if: always()
        run: |
          cd testing-microservice && python generate_report.py \
            --xml reports/weather-prod-results.xml \
            --service weather \
            --env prod \
            --out reports/weather-prod-report.txt

      - name: Upload weather prod test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-prod-test-report
          path: |
            testing-microservice/reports/weather-prod-results.xml
            testing-microservice/reports/weather-prod-report.txt

  deploy-alert-prod:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up SAM
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: SAM Build
        run: sam build
        working-directory: alert-microservice

      - name: SAM Deploy Prod
        run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --config-env prod
        working-directory: alert-microservice

      - name: Install testing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r testing-microservice/requirements.txt

      - name: Create reports directory
        run: mkdir -p testing-microservice/reports

      - name: Run alert smoke tests
        run: |
          cd testing-microservice && pytest tests/alert/smoke \
            --env prod \
            --junitxml=reports/alert-prod-results.xml

      - name: Generate alert prod report
        if: always()
        run: |
          cd testing-microservice && python generate_report.py \
            --xml reports/alert-prod-results.xml \
            --service alert \
            --env prod \
            --out reports/alert-prod-report.txt

      - name: Upload alert prod test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alert-prod-test-report
          path: |
            testing-microservice/reports/alert-prod-results.xml
            testing-microservice/reports/alert-prod-report.txt
  deploy-transport-prod:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up SAM
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: SAM Build
        run: sam build
        working-directory: transport-microservice

      - name: SAM Deploy Prod
        run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --config-env prod
        working-directory: transport-microservice

      - name: Install testing dependencies
