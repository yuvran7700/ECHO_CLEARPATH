AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Runtime: python3.11
    CodeUri: .
    Timeout: 30
    MemorySize: 128

Resources:

  ClassificationLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: classification-lambda
      Handler: src.lambda_handlers.classification_handler.classification_handler
      Policies:
        - AmazonDynamoDBFullAccess
      Events:
        DynamoDBStream:
          Type: DynamoDB
          Properties:
            Stream: arn:aws:dynamodb:us-east-1:102882775486:table/clearpath-alert-data/stream/2026-03-23T09:21:48.213
            StartingPosition: LATEST
            BatchSize: 10
            Enabled: true

Outputs:
  ClassificationLambda:
    Description: Classification Lambda ARN
    Value: !GetAtt ClassificationLambda.Arn
